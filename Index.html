<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
canvas{display:block}
</style>
</head>
<body>
<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);
camera.position.set(0,0,7.5);

const renderer=new THREE.WebGLRenderer({
 antialias:false,
 powerPreference:'high-performance'
});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

const plant=new THREE.Group();
scene.add(plant);

// ---------------- STEM ----------------

const stemGroup=new THREE.Group();
plant.add(stemGroup);

const greenMat=new THREE.MeshStandardMaterial({
 color:0x16852b,
 roughness:.65,
 metalness:.05
});

const lightGreen=new THREE.MeshStandardMaterial({
 color:0x50d65c,
 roughness:.5
});

const stemCurve=new THREE.CatmullRomCurve3([
 new THREE.Vector3(0,-2.65,0),
 new THREE.Vector3(-.05,-1.8,0),
 new THREE.Vector3(.04,-.9,0),
 new THREE.Vector3(0,0,0)
]);

const stem=new THREE.Mesh(
 new THREE.TubeGeometry(stemCurve,40,.045,8,false),
 greenMat
);
stemGroup.add(stem);

// Leaf geometry
function createLeaf(side,y){
 const shape=new THREE.Shape();
 shape.moveTo(0,0);
 shape.bezierCurveTo(.25,.12,.65,.48,.95,.34);
 shape.bezierCurveTo(.75,.04,.3,-.10,0,0);

 const geo=new THREE.ShapeGeometry(shape,20);
 const leaf=new THREE.Mesh(geo,lightGreen);

 leaf.position.set(0,y,0);
 leaf.rotation.z=side===1?.2:Math.PI-.2;
 leaf.rotation.y=side*.25;
 leaf.scale.set(side===1?1:-1,1,1);

 return leaf;
}

stemGroup.add(createLeaf(1,-1.15));
stemGroup.add(createLeaf(-1,-1.9));

// Leaf veins
function vein(y,side){
 const points=[
  new THREE.Vector3(0,y,.015),
  new THREE.Vector3(side*.35,y+.12,.02),
  new THREE.Vector3(side*.75,y+.3,.015)
 ];
 const curve=new THREE.CatmullRomCurve3(points);
 return new THREE.Mesh(
  new THREE.TubeGeometry(curve,12,.009,5,false),
  new THREE.MeshStandardMaterial({color:0x9cff85})
 );
}

stemGroup.add(vein(-1.15,1));
stemGroup.add(vein(-1.9,-1));

// ---------------- ROSE HEAD ----------------

const flower=new THREE.Group();
flower.position.y=.05;
plant.add(flower);

const chars="01アイウエオカキクケコサシスセソ{}<>/+-*";

const atlas=document.createElement('canvas');
atlas.width=512;
atlas.height=512;
const ac=atlas.getContext('2d');

ac.fillStyle='white';
ac.font='bold 25px monospace';
ac.textAlign='center';
ac.textBaseline='middle';

for(let i=0;i<256;i++){
 ac.fillText(
  chars[i%chars.length],
  (i%16)*32+16,
  Math.floor(i/16)*32+16
 );
}

const tex=new THREE.CanvasTexture(atlas);
tex.magFilter=THREE.NearestFilter;

const pos=[],glyph=[],seed=[],colors=[],sparkles=[];

function add(x,y,z,layer){
 pos.push(x,y,z);
 glyph.push(Math.floor(Math.random()*256));
 seed.push(Math.random()*100);

 let shade=Math.random();
 let brightness=.55+shade*.45;

 let r=layer===0?.78:layer===1?.88:1;
 let g=layer===0?.12:layer===1?.22:.38;
 let b=layer===0?.34:layer===1?.48:.68;

 if(shade>.88){
  r=1;
  g=.7;
  b=.9;
 }

 colors.push(
  r*brightness,
  g*brightness,
  b*brightness
 );

 sparkles.push(Math.random()<.20?1:0);
}

// Rounded rose petals
function petal(angle,base,length,width,count,layer){
 for(let i=0;i<count;i++){
  let u=Math.random();
  let v=Math.random()*2-1;
  let shape=Math.pow(Math.sin(Math.PI*u),.68);

  let along=u*length;
  let across=v*width*shape/2;

  let curl=Math.pow(Math.abs(v),2)*.19;
  let dome=Math.sin(Math.PI*u)*.20;

  let r=base+along;

  let x=r*Math.cos(angle)-across*Math.sin(angle);
  let y=r*Math.sin(angle)+across*Math.cos(angle);
  let z=layer*.11+dome+curl;

  add(x,y,z,layer);
}

// Five large outer petals
}

for(let i=0;i<5;i++)
 petal(i*Math.PI*2/5+.25,.23,1.15,.48,1700,0);

// Second layer
for(let i=0;i<8;i++)
 petal(i*Math.PI*2/8+.1,.13,.91,.39,1500,1);

// Middle petals
for(let i=0;i<9;i++)
 petal(i*Math.PI*2/9+.35,.07,.68,.30,1300,2);

// Inner petals
for(let i=0;i<10;i++)
 petal(i*Math.PI*2/10,.025,.43,.22,1000,3);

// Spiral center
for(let i=0;i<2600;i++){
 let a=i*.105;
 let r=.015+i*.00019;

 add(
  Math.cos(a)*r,
  Math.sin(a)*r,
  .38+Math.sin(a)*.04,
  4
 );
}

const geo=new THREE.BufferGeometry();

geo.setAttribute(
 'position',
 new THREE.Float32BufferAttribute(pos,3)
);

geo.setAttribute(
 'aGlyph',
 new THREE.Float32BufferAttribute(glyph,1)
);

geo.setAttribute(
 'aSeed',
 new THREE.Float32BufferAttribute(seed,1)
);

geo.setAttribute(
 'aColor',
 new THREE.Float32BufferAttribute(colors,3)
);

geo.setAttribute(
 'aSpark',
 new THREE.Float32BufferAttribute(sparkles,1)
);

const mat=new THREE.ShaderMaterial({
 transparent:true,
 depthWrite:false,

 uniforms:{
  time:{value:0},
  bloom:{value:0},
  atlas:{value:tex}
 },

 vertexShader:`
 attribute float aGlyph;
 attribute float aSeed;
 attribute vec3 aColor;
 attribute float aSpark;

 uniform float time;
 uniform float bloom;

 varying vec2 uvGlyph;
 varying float flicker;
 varying float sparkle;
 varying vec3 color;

 void main(){

  vec3 p=position*bloom;

  p.z+=sin(time*1.3+aSeed)*.025;

  vec4 mv=modelViewMatrix*vec4(p,1.);

  gl_Position=projectionMatrix*mv;

  flicker=.55+.45*sin(
   time*3.+aSeed*5.
  );

  float flash=pow(
   max(0.,sin(
    time*(2.5+aSeed*.1)+aSeed*7.
   )),
   16.
  );

  sparkle=aSpark*flash;
  color=aColor;

  float index=floor(aGlyph);

  uvGlyph=vec2(
   mod(index,16.)/16.,
   floor(index/16.)/16.
  );

  gl_PointSize=clamp(
   (7.+flicker*3.+sparkle*5.)
   *(5.5/-mv.z),
   2.,
   19.
  );
 }
 `,

 fragmentShader:`
 uniform sampler2D atlas;

 varying vec2 uvGlyph;
 varying float flicker;
 varying float sparkle;
 varying vec3 color;

 void main(){

  vec2 uv=uvGlyph+gl_PointCoord/16.;

  float glyph=texture2D(atlas,uv).r;

  if(glyph<.2)discard;

  vec3 pink=vec3(1.,.28,.62)*color;
  vec3 white=vec3(1.,.96,1.);

  vec3 finalColor=mix(
   pink,
   white,
   sparkle
  );

  gl_FragColor=vec4(
   finalColor,
   glyph*(.55+flicker*.35+sparkle*.1)
  );
 }
 `
});

flower.add(new THREE.Points(geo,mat));

// ---------------- ANIMATION ----------------

const clock=new THREE.Clock();

function smooth(a,b,x){
 let v=Math.max(
  0,
  Math.min(1,(x-a)/(b-a))
 );

 return v*v*(3-2*v);
}

function animate(){

 requestAnimationFrame(animate);

 const t=clock.getElapsedTime();
 const cycle=t%16;

 // Growth from a tiny green sprout
 const growth=smooth(0,4,cycle);

 // Bud opens after stem grows
 const opening=smooth(3.5,7,cycle);

 // Stem stretches from the ground upwards
 stemGroup.scale.y=Math.max(
  .001,
  growth
 );

 stemGroup.position.y=
  -2.65*(1-growth);

 // Flower begins as a tiny bud
 const bud=.035+.965*opening;

 flower.scale.setScalar(bud);

 // Flower slowly sways
 plant.rotation.z=
  Math.sin(t*.6)*.035;

 flower.rotation.y=
  Math.sin(t*.35)*.22;

 flower.rotation.x=
  .12+Math.sin(t*.25)*.08;

 mat.uniforms.time.value=t;
 mat.uniforms.bloom.value=bud;

 renderer.render(scene,camera);
}

animate();

addEventListener('resize',()=>{

 camera.aspect=
  innerWidth/innerHeight;

 camera.updateProjectionMatrix();

 renderer.setSize(
  innerWidth,
  innerHeight
 );

});
</script>
</body>
</html>
